<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kothar render helper</title>
<!--
  Opened by a headless Chromium browser (Chrome, Edge, Brave), never by the user.
  ?job=<file URL of a .js file that sets window.KOTHAR_JOB>
  Writes one JSON result into the element with id "out", read with --dump-dom.
  See references/rendering.md for the job shape and the commands.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
</head>
<body>
<pre id="out">{"status":"pending"}</pre>
<script>
(function () {
  var out = document.getElementById('out');
  function done(result) { out.textContent = JSON.stringify(result); }
  function fail(message) { done({ status: 'error', message: String(message) }); }

  function loadJob(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = function () { window.KOTHAR_JOB ? resolve(window.KOTHAR_JOB) : reject('the job file did not set window.KOTHAR_JOB'); };
      s.onerror = function () { reject('could not load the job file: ' + url); };
      document.head.appendChild(s);
    });
  }

  function loadFont(url) {
    return new Promise(function (resolve, reject) {
      if (!window.opentype) return reject('opentype.js did not load (offline?)');
      opentype.load(url, function (err, font) { err ? reject('font: ' + err) : resolve(font); });
    });
  }

  // Text to one path, baseline at y = 0, starting at x = 0. tracking is in em.
  function outline(item) {
    return loadFont(item.font).then(function (font) {
      var size = item.size || 100, tracking = (item.tracking || 0) * size, x = 0;
      var path = new opentype.Path();
      var glyphs = font.stringToGlyphs(item.text);
      glyphs.forEach(function (g, i) {
        path.extend(g.getPath(x, 0, size));
        x += g.advanceWidth * size / font.unitsPerEm;
        if (i < glyphs.length - 1) {
          x += font.getKerningValue(g, glyphs[i + 1]) * size / font.unitsPerEm + tracking;
        }
      });
      var box = path.getBoundingBox();
      return { text: item.text, d: path.toPathData(2), advance: +x.toFixed(2),
        ascender: +(font.ascender * size / font.unitsPerEm).toFixed(2),
        descender: +(font.descender * size / font.unitsPerEm).toFixed(2),
        bbox: [box.x1, box.y1, box.x2, box.y2].map(function (n) { return +n.toFixed(2); }) };
    });
  }

  function svgToPng(svg, size) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = c.height = size;
        c.getContext('2d').drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b.arrayBuffer().then(function (a) { resolve(new Uint8Array(a)); }); }, 'image/png');
      };
      img.onerror = function () { reject('the SVG for the icon could not be drawn'); };
      img.src = url;
    });
  }

  // An .ico whose entries are PNGs (read by every browser since 2008).
  function ico(item) {
    var sizes = item.sizes || [16, 32, 48];
    return Promise.all(sizes.map(function (s) { return svgToPng(item.svg, s); })).then(function (pngs) {
      var head = 6 + 16 * pngs.length, total = head;
      pngs.forEach(function (p) { total += p.length; });
      var buf = new Uint8Array(total), view = new DataView(buf.buffer), offset = head;
      view.setUint16(2, 1, true); view.setUint16(4, pngs.length, true);
      pngs.forEach(function (p, i) {
        var e = 6 + 16 * i, s = sizes[i] >= 256 ? 0 : sizes[i];
        buf[e] = s; buf[e + 1] = s;
        view.setUint16(e + 4, 1, true); view.setUint16(e + 6, 32, true);
        view.setUint32(e + 8, p.length, true); view.setUint32(e + 12, offset, true);
        buf.set(p, offset); offset += p.length;
      });
      var bin = '';
      for (var i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
      return { sizes: sizes, base64: btoa(bin) };
    });
  }

  var job = new URLSearchParams(location.search).get('job');
  if (!job) return fail('missing ?job=');
  loadJob(job).then(function (j) {
    return Promise.all([
      Promise.all((j.outline || []).map(outline)),
      j.ico ? ico(j.ico) : null
    ]).then(function (r) { done({ status: 'ok', outline: r[0], ico: r[1] }); });
  }).catch(fail);
})();
</script>
</body>
</html>
