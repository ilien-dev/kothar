.hop2{animation:hop2 10s cubic-bezier(.4,0,.2,1) infinite}.ok2{animation:ok2 10s ease-out infinite}
@keyframes hop3{0%,50%{transform:translate(0,0);opacity:0}53%{opacity:1}68%{transform:translate(252px,47px);opacity:1}71%,100%{transform:translate(252px,47px);opacity:0}}
@keyframes ok3{0%,69%{opacity:0}72%,97%{opacity:1}100%{opacity:0}}
.hop3{animation:hop3 10s cubic-bezier(.4,0,.2,1) infinite}.ok3{animation:ok3 10s ease-out infinite}
@keyframes hop4{0%,74%{transform:translate(0,0);opacity:0}77%{opacity:1}92%{transform:translate(252px,143px);opacity:1}95%,100%{transform:translate(252px,143px);opacity:0}}
