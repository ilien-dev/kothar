<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="La carpeta de la skill Kothar se instala en cuatro agentes por turnos: en Claude Code como plugin y en Codex, Gemini u otro agente con npx; cada fila muestra su logotipo y una marca cuando queda instalada">
<style>
/* 10 s  four parcels leave the skill folder one after another; each agent row answers with a tick */
@keyframes hop1{0%,2%{transform:translate(0,0);opacity:0}5%{opacity:1}20%{transform:translate(252px,-145px);opacity:1}23%,100%{transform:translate(252px,-145px);opacity:0}}
@keyframes ok1{0%,21%{opacity:0}24%,97%{opacity:1}100%{opacity:0}}
.hop1{animation:hop1 10s cubic-bezier(.4,0,.2,1) infinite}.ok1{animation:ok1 10s ease-out infinite}
@keyframes hop2{0%,26%{transform:translate(0,0);opacity:0}29%{opacity:1}44%{transform:translate(252px,-49px);opacity:1}47%,100%{transform:translate(252px,-49px);opacity:0}}
