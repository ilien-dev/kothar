<circle cx="230" cy="70" r="12" fill="none" stroke="#14273C" stroke-width="2" />
<path d="M190 200h30v8h-22v22h-8z" fill="none" stroke="#14273C" stroke-width="2" />
<circle cx="80" cy="250" r="7" fill="none" stroke="#14273C" stroke-width="2" />
</pattern>
</defs>
<rect width="1280" height="448" fill="#0A1420" />
