<svg data-jano-src="17f2f518da264297" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="Tres de las nueve opciones de logotipo dibujadas para este repositorio: El crisol sale del nombre, Escuadra y punto de lo que hace el proyecto y El lingote medido de ambos; un resaltado pasa de una tarjeta a otra y Escuadra y punto aparece como la elegida">
<style>@font-face{font-family:SG;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG7;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JB;src:url(data:font/woff2;base64,) format('woff2')}
text{text-rendering:geometricPrecision}.s{font-family:SG,sans-serif}.b{font-family:SG7,sans-serif;font-weight:700}.m{font-family:JB,monospace;font-variant-ligatures:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* 9 s  frame   |card1======|card2======|card3======|
        marks    pop as their card is lit, one after another */
@keyframes rise{to{transform:translateY(-320px)}}
@keyframes lit{0%,30%{opacity:1}36%,94%{opacity:0}100%{opacity:1}}
@keyframes pop{0%{transform:scale(1)}6%{transform:scale(1.12)}14%,100%{transform:scale(1)}}
.rise{animation:rise 40s linear infinite}
.lit{animation:lit 9s ease-in-out infinite}
.pop{animation:pop 9s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
</style>
<defs>
<pattern id="sq" width="320" height="320" patternUnits="userSpaceOnUse">
