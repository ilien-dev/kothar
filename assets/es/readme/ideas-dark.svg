<path d="M780 370l5 5 9-10" fill="none" stroke="#4DA8F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text class="s" x="802" y="376" font-size="16" fill="#4DA8F0">la elegida</text>

