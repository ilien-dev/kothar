<text class="b" x="522" y="216" font-size="20" fill="#F3F6FA">El crisol</text>
<text class="s" font-size="16" fill="#AEB9C6"><tspan x="522" y="252">El crisol de Kothar,</tspan><tspan x="522" y="274">con el metal aún</tspan><tspan x="522" y="296">fundido dentro.</tspan></text>

