<text id="title" class="b" font-size="40" fill="#F3F6FA"><tspan x="56" y="152">Del nombre, de lo</tspan><tspan x="56" y="198">que hace, o ambos</tspan></text>
<text id="sub" class="s" font-size="18" fill="#AEB9C6"><tspan x="56" y="244">Tres de las nueve opciones</tspan><tspan x="56" y="268">dibujadas para este repositorio.</tspan></text>
