<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kothar · logo identity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>:root{--bg:#F2F2F3;--ink:#0B0B0C;--soft:#3C3C40;--mute:#55555A;--line:#B9B9BE;--panel:#E4E4E7;--red:#C8102E;--ghost:#85858B;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
a{color:var(--ink)}a:hover{color:var(--red)}
svg{display:block;max-width:100%;height:auto}
[data-ink="accent"]{color:var(--accent,currentColor)}
.pad{padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px)}
.mono{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.mute{color:var(--mute)}
.red{color:var(--red)}

.top{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding-top:14px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.dot{display:inline-block;width:7px;height:7px;margin-right:8px;background:var(--red)}
.dot.off{background:var(--ghost)}

.steps{display:flex;flex-wrap:wrap}
.step{flex:1 1 200px;min-width:0;padding:16px 12px 20px 0;border:0;border-top:6px solid var(--line);background:none;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--mute)}
.step .n{font-size:clamp(56px,7vw,84px);font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--ghost)}
.step strong{font-size:16px}
.step.done,.step.now{color:var(--ink)}
.step.done{border-top-color:var(--ink)}
.step.now{border-top-color:var(--red)}
.step.done .n,.step.now .n{color:var(--ink)}
.step.now .mono{color:var(--red)}
button.step:hover .n{color:var(--red)}
.step.viewing{background:var(--panel)}

.section{padding-top:40px;border-top:1px solid var(--ink)}
.section+.section{margin-top:56px}
.head{display:flex;flex-wrap:wrap;gap:8px 32px;align-items:baseline;justify-content:space-between}
h1{margin:0;font-size:clamp(32px,4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sub{margin-top:24px;padding-top:24px;border-top:1px solid var(--ink)}
.notice{margin-top:16px;padding:12px 16px;border:1px solid var(--red);font-size:14px}
.readonly{padding-top:14px;padding-bottom:14px;border-top:1px solid var(--ink);font-size:15px}

.grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:28px}
.card{min-width:0;min-height:200px;padding:18px;background:var(--bg);color:var(--ink);border:1px solid var(--ink);text-align:left;display:flex;flex-direction:column;gap:10px}
.card.on,.tile.on,.pick.on,.word.on,.pal.on{background:var(--ink);color:var(--bg)}
.card .row{display:flex;justify-content:space-between;gap:8px;font:700 11px/1 var(--mono);letter-spacing:.08em}
.card .name{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1;overflow-wrap:anywhere}
.card p{margin:0;font-size:14px;line-height:1.4}
.tile{flex:1 1 240px;min-width:0;padding:18px;background:var(--bg);color:var(--ink);border:1px solid var(--ink);text-align:left;display:flex;flex-direction:column;gap:14px}
.tile .sample{font-size:48px;line-height:1.05;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box{flex:1 1 300px;min-width:0;padding:18px;border:1px solid var(--ink);display:flex;flex-direction:column;gap:12px}
.box.dashed{border:1px dashed var(--mute)}
.box p{margin:0;font-size:14px;color:var(--soft)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.check input{width:22px;height:22px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--red)}
.field{min-height:46px;width:100%;padding:0 12px;background:#fff;border:1px solid var(--ink);font-size:15px}
.legal{font-size:12px;line-height:1.4;color:#A30D25}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.pick{flex:1 1 56px;min-height:44px;background:var(--bg);border:1px solid var(--ink);font:700 16px/1 var(--mono)}

.logos{display:flex;flex-wrap:wrap;gap:24px;margin-top:28px}
.logo{flex:1 1 320px;max-width:560px;min-width:0;display:flex;flex-direction:column;gap:12px}
.logo .row{display:flex;justify-content:space-between;gap:8px}
.pair{display:flex;gap:8px}
.pair>div{flex:1 1 0;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:18%}
.pair svg{width:100%}
.ver>svg,.ver>div{width:44%;flex:0 0 auto}
.on-white{background:#fff;color:#0B0B0C;border:1px solid var(--line)}
.on-black{background:#0B0B0C;color:#F2F2F3}
.logo.on .on-white{border-color:var(--red)}
.sizes{display:flex;align-items:flex-end;gap:24px;padding:16px;background:var(--panel)}
.sizes span{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font:500 11px/1 var(--mono);color:var(--soft)}
.facts{display:flex;flex-direction:column;font:500 12px/1.4 var(--mono)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.facts div:last-child{border-bottom:1px solid var(--line)}
.facts .v{text-align:right}
.why{margin:0;font-size:14px;color:var(--soft)}
.warns{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.4;color:var(--soft)}
.warns li{padding:4px 0 4px 14px;position:relative}
.warns li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;background:var(--red)}
.btn{min-height:44px;padding:0 18px;background:transparent;border:1px solid var(--ink);font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.btn.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.55}

.duo{display:flex;flex-wrap:wrap;gap:24px;margin-top:20px;align-items:stretch}
.words{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:8px}
.word{min-height:76px;padding:10px 18px;background:var(--bg);border:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left}
.word svg{height:34px;width:auto;max-width:60%}
.word .txt{font-size:34px;line-height:1;letter-spacing:-.03em}
.word .mono{text-align:right}
.combo{flex:2 1 480px;min-width:0;display:flex;flex-direction:column}
.stage{flex:1 1 auto;min-height:220px;padding:32px;background:#fff;color:#0B0B0C;border:1px solid var(--ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px}
.stage .m{flex:0 0 auto;width:96px}
.stage .w svg{height:72px;width:auto;max-width:100%}
.stage .w.txt{font-size:clamp(48px,7vw,88px);line-height:1;letter-spacing:-.03em}
.cap{padding:12px 16px;background:var(--ink);color:var(--bg)}

.prev{flex:3 1 520px;min-width:0;display:flex;flex-direction:column;gap:8px}
.ground{flex:1 1 auto;padding:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px;color:var(--c-ink)}
.ground.light{min-height:300px;border:1px solid var(--ink)}
.ground.dark{min-height:220px}
.ground .m{flex:0 0 auto;width:120px}
.ground.dark .m{width:88px}
.ground .w svg{height:88px;width:auto;max-width:100%}
.ground.dark .w svg{height:64px}
.ground .w.txt{font-size:clamp(52px,8vw,108px);line-height:.95;letter-spacing:-.03em}
.ground.dark .w.txt{font-size:clamp(40px,6vw,76px)}
.mini{display:flex;flex-wrap:wrap;gap:8px}
.mini>div{flex:1 1 120px;padding:14px;display:flex;align-items:flex-end;gap:14px;font:500 11px/1 var(--mono)}
.mini .nums{flex:2 1 240px;border:1px solid var(--ink);flex-direction:column;align-items:flex-start;gap:4px;font:500 12px/1.5 var(--mono)}
.pals{flex:2 1 380px;min-width:0;display:flex;flex-direction:column;gap:8px}
.pal{padding:14px;background:var(--bg);border:1px solid var(--ink);text-align:left;display:flex;flex-direction:column;gap:10px}
.pal .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pal strong{font-size:19px}
.strip{display:flex;height:40px;border:1px solid currentColor}
.strip span{flex:1 1 0}
.strip span:first-child{flex:3 1 0}
.pal .why{color:inherit;font-size:13px}

.bar{margin-top:56px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px;background:var(--ink);color:var(--bg);position:sticky;bottom:0}
.bar .sum{display:flex;flex-wrap:wrap;gap:6px 28px;font:500 12px/1.5 var(--mono)}
.bar .go{min-height:48px;padding:0 28px;background:var(--bg);color:var(--ink);border:0;font:700 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.bar .go:disabled{opacity:.45}
.bar .err{flex:1 1 100%;font-size:13px;color:#FF8A96}

.loading{padding-top:96px;padding-bottom:120px;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:48px 64px;align-items:flex-end}
.loading .big{flex:2 1 520px;min-width:0;display:flex;flex-direction:column;gap:28px}
.loading h1{font-size:clamp(64px,11vw,168px);line-height:.85;letter-spacing:-.05em}
.loading p{margin:0;max-width:520px;color:var(--soft)}
.track{height:6px;background:#D5D5D9;overflow:hidden}
.track div{width:25%;height:100%;background:var(--red);animation:sweep 1.6s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(400%)}}
.tasks{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;font:500 13px/1.4 var(--mono)}
.tasks div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);color:var(--mute)}
.tasks div:first-child{border-top-color:var(--ink)}
.tasks div:last-child{border-bottom:1px solid var(--ink)}
.tasks .done{color:var(--ink)}
.tasks .doing{color:var(--red)}

.hero{position:relative;padding-top:clamp(64px,10vw,144px);padding-bottom:clamp(64px,10vw,144px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;overflow:hidden;color:var(--c-ink)}
.hero .lock{position:relative;width:min(100%,980px)}
.cols{display:flex;flex-wrap:wrap;gap:32px 56px;margin-top:56px}
.cols>div{flex:1 1 380px;min-width:0}
.lead{margin:14px 0 0;font-size:22px;line-height:1.4;font-weight:500;letter-spacing:-.01em}
.vers{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ver{flex:1 1 220px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative}
.ver .tag{position:absolute;left:12px;bottom:10px}
.ver .play{position:absolute;left:4px;bottom:2px;min-height:44px;padding:0 8px;background:transparent;border:0;font:700 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.swatches{display:flex;flex-wrap:wrap;margin-top:12px;border:1px solid var(--ink);font:500 11px/1.4 var(--mono)}
.swatches div{flex:1 1 90px;padding:56px 12px 12px}
.swatches div:first-child{flex:2 1 120px}
.specimen{margin-top:12px;font-size:clamp(44px,6vw,76px);line-height:.95;letter-spacing:-.03em;overflow-wrap:anywhere}
.scale{display:flex;flex-wrap:wrap;align-items:flex-end;gap:28px;margin-top:12px;padding:24px;background:#fff;border:1px solid var(--line);color:var(--c-ink)}
.scale span{display:flex;flex-direction:column;gap:8px;font:500 11px/1 var(--mono);color:#3C3C40}
.clear{margin-top:12px;padding:8%;background:var(--panel);display:flex;justify-content:center}
.clear div{padding:calc(min(100%,420px)*.12);outline:1px dashed var(--red);width:min(100%,420px)}
.files{margin-top:56px;padding-top:16px;padding-bottom:72px;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px 28px;font:500 12px/1.6 var(--mono)}
@media (prefers-reduced-motion:reduce){.track div{animation:none;width:100%}}
@media print{.bar,.play{display:none}}
.keep{align-self:flex-end;min-height:40px;margin:-4px 0 6px;padding:0 10px;background:none;border:0;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.keep.on{color:var(--red);font-weight:700}

/* ---- compact layout: a step should fit one screen without scrolling ---- */
.top{padding-top:8px;padding-bottom:8px}
.step{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:8px 12px 10px 0;border-top-width:4px}
.step .n{font-size:34px;line-height:1}
.step strong{font-size:15px}
.step .mono{flex:1 1 100%;font-size:10px}
.section{padding-top:16px}
.section+.section{margin-top:24px}
h1{font-size:26px}
h2{font-size:20px}
.sub{margin-top:16px;padding-top:14px}
.grid,.cards,.logos{margin-top:12px}
.card{min-height:0;padding:12px;gap:6px}
.card .name{font-size:26px}
.card p{font-size:13px;line-height:1.35}
.tile{padding:12px;gap:8px}
.tile .sample{font-size:34px}
.box{padding:12px;gap:8px}
.bar{margin-top:14px;padding-top:8px;padding-bottom:8px}
.bar .go{min-height:44px}
.duo{gap:16px;margin-top:12px}
.ground{padding:16px;gap:20px}
.ground.light{min-height:0;height:clamp(140px,27vh,260px)}
.ground.dark{min-height:0;height:clamp(96px,17vh,170px)}
.ground .m{width:clamp(56px,9vh,96px)}
.ground.dark .m{width:clamp(40px,6.5vh,68px)}
.ground .w.txt{font-size:clamp(34px,8vh,76px)}
.ground.dark .w.txt{font-size:clamp(26px,5.6vh,52px)}
.ground .w svg{height:clamp(40px,8vh,72px)}
.ground.dark .w svg{height:clamp(30px,5.6vh,50px)}
.mini>div{padding:8px 12px}
.pals{gap:6px}
.palrow{display:flex;gap:6px;align-items:stretch}
.palrow .pal{flex:1 1 auto;min-width:0}
.pal{padding:8px 10px;gap:6px}
.pal strong{font-size:15px}
.pal .mono{font-size:10px}
.strip{height:18px}
.pal .why{font-size:12px;line-height:1.3}
.keep{align-self:stretch;flex:0 0 108px;min-height:44px;margin:0;border:1px solid var(--line);text-align:center}
.keep.on{border-color:var(--red)}
.pals .box{flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
.pals .box label{flex:1 1 100%;font-size:13px}
.pals .box .field{flex:1 1 160px;width:auto;min-height:44px}
.pals .box .btn{flex:0 0 auto}
.logo{flex:1 1 250px;max-width:400px;gap:8px}
.pair>div{padding:14%}
.sizes{padding:10px;gap:18px}
.facts div{padding:5px 0}
.why{font-size:13px}
.words{gap:6px}
.word{min-height:56px;padding:6px 14px}
.word svg{height:28px}
.word .txt{font-size:28px}
.stage{min-height:160px;padding:20px}
.loading{padding-top:36px;padding-bottom:40px;gap:28px 48px}
.loading h1{font-size:clamp(44px,8vw,108px)}
.loading .big{gap:16px}
.tasks div{padding:8px 0}
.hero{padding-top:clamp(28px,6vh,72px);padding-bottom:clamp(28px,6vh,72px)}
.hero .lock{width:min(100%,760px)}
.cols{margin-top:28px;gap:24px 48px}
.readonly{padding-top:8px;padding-bottom:8px;font-size:14px}
/* the confirm bar always sits at the bottom of the window */
#app{min-height:100vh;display:flex;flex-direction:column}
#app>main{flex:1 0 auto;padding-bottom:14px}
.bar{margin-top:auto}

/* ---- motion: hover, answers to a choice, entrances when the view changes, a few quiet loops ---- */
.forge{display:inline-flex;gap:4px;margin-right:12px;vertical-align:middle}
.forge i{width:9px;height:9px;background:var(--red)}
@keyframes k-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes k-drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes k-pop{0%{transform:scale(.96)}55%{transform:scale(1.035)}100%{transform:none}}
@keyframes k-pulse{50%{opacity:.3;transform:scale(.6)}}
@keyframes k-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes k-unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes k-hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}}
@keyframes k-breathe{50%{opacity:.45}}
@media (prefers-reduced-motion:no-preference){
  button,.step,a{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .18s cubic-bezier(.2,.8,.2,1),letter-spacing .2s}
  .card:not(:disabled):hover,.tile:not(:disabled):hover,.pal:not(:disabled):hover,.word:not(:disabled):hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
  .card.on:not(:disabled):hover,.tile.on:not(:disabled):hover,.pal.on:not(:disabled):hover,.word.on:not(:disabled):hover{box-shadow:4px 4px 0 var(--red)}
  .btn:not(:disabled):not(.on):hover,.pick:not(:disabled):not(.on):hover{background:var(--ink);color:var(--bg)}
  .keep:hover{color:var(--ink);border-color:var(--ink)}
  .go:not(:disabled):hover{background:var(--red);color:#fff;letter-spacing:.14em}
  button:not(:disabled):active{transform:scale(.97);box-shadow:none}
  button.step:hover{background:var(--panel)}
  .pair svg,.ver svg,.ver>div{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .logo:hover .pair svg{transform:scale(1.1)}
  .ver:hover svg,.ver:hover>div{transform:scale(1.08)}
  .strip span,.swatches div{transition:flex-grow .3s cubic-bezier(.2,.8,.2,1)}
  .pal:hover .strip span:nth-child(2){flex-grow:2.2}
  .swatches div:hover{flex-grow:3}
  .files a{transition:color .15s,letter-spacing .2s}
  .files a:hover{letter-spacing:.04em}

  /* quiet loops */
  .dot{animation:k-pulse 1.8s ease-in-out infinite}
  .dot.off{animation:none}
  .step.now .mono{animation:k-breathe 2.2s ease-in-out infinite}
  .tasks .doing span:last-child{animation:k-pulse 1.1s ease-in-out infinite}
  .forge i{animation:k-hop 1.1s cubic-bezier(.3,.7,.3,1) infinite}
  .forge i:nth-child(2){animation-delay:.14s}
  .forge i:nth-child(3){animation-delay:.28s}

  /* the chosen element answers the click */
  .pop{animation:k-pop .36s cubic-bezier(.3,1.4,.5,1)}

  /* a new palette repaints the preview */
  .swap .ground{animation:k-wipe .5s cubic-bezier(.2,.8,.2,1) both}
  .swap .ground.dark{animation-delay:.08s}
  .swap .ground .m,.swap .ground .w{animation:k-rise .45s .12s cubic-bezier(.2,.8,.2,1) both}
  .swap .mini>div{animation:k-rise .4s .18s both}
  .swap .mini .nums span{animation:k-rise .35s both}
  .swap .mini .nums span:nth-child(1){animation-delay:.22s}
  .swap .mini .nums span:nth-child(2){animation-delay:.3s}
  .swap .mini .nums span:nth-child(3){animation-delay:.38s}
  .swap .pal.on .why{animation:k-unfold .3s .05s both}
  .swap .bar .sum span:last-child{animation:k-rise .35s both}

  /* entrances, only when the step or screen changes */
  .enter .step .n{animation:k-drop .5s cubic-bezier(.2,.8,.2,1) both}
  .enter .step:nth-child(2) .n{animation-delay:.06s}
  .enter .step:nth-child(3) .n{animation-delay:.12s}
  .enter .step:nth-child(4) .n{animation-delay:.18s}
  .enter .head,.enter .notice,.enter .readonly,.enter .box,.enter .combo,.enter .prev,.enter .specimen{animation:k-rise .5s cubic-bezier(.2,.8,.2,1) both}
  .enter .card,.enter .tile,.enter .logo,.enter .palrow,.enter .word{animation:k-rise .5s cubic-bezier(.2,.8,.2,1) both}
  .enter :is(.card,.tile,.logo,.palrow,.word):nth-child(1){animation-delay:.04s}
  .enter :is(.card,.tile,.logo,.palrow,.word):nth-child(2){animation-delay:.09s}
  .enter :is(.card,.tile,.logo,.palrow,.word):nth-child(3){animation-delay:.14s}
  .enter :is(.card,.tile,.logo,.palrow,.word):nth-child(4){animation-delay:.19s}
  .enter :is(.card,.tile,.logo,.palrow,.word):nth-child(5){animation-delay:.24s}
  .enter :is(.card,.tile,.logo,.palrow,.word):nth-child(6){animation-delay:.29s}
  .enter :is(.card,.tile,.logo,.palrow,.word):nth-child(7){animation-delay:.34s}

    const step = S.flow.step;

    const data = step === 1 ? { name: ui.name, font: ui.font === -1 ? { ...font, licenseConfirmedByUser: ui.licence } : font, svgWordmark: ui.svg, count: ui.count }
        : step === 2 ? { concept: ui.concept, wordmark: ui.wordmark, colors: ui.colors } : { palette: ui.palette };
    await send(data);
}
async function send(data) {
    const step = S.flow.step;
    ui.sending = true;
    ui.error = '';
    render();
    try {
        const r = await fetch('/api/select', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ step, data }) });
        const j = await r.json();
        if (!j.ok) {
            ui.sending = false;
            ui.error = j.error || 'error';
            render();
            return;
        }
        await poll();
    }
    catch (e) {
        ui.sending = false;
        ui.error = String(e.message);
        render();
    }
}
root.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled)
        return;
    const act = el.dataset.act, v = el.dataset.v ?? '';
    if (act === 'view') {
        ui.view = Number(v);
        window.scrollTo(0, 0);
    }
    else if (act === 'replay') {
        const box = document.getElementById('k-anim');
        if (box) {
            const html = box.innerHTML;
            box.innerHTML = '';
            void box.offsetWidth;
            box.innerHTML = html;
        }
        return;
    }
    else if (act === 'confirm') {
        void confirmSelection();
        return;
    }
    else if (act === 'restart') {
        if (window.confirm(t('restartAsk')))
            void send({ restart: true });
        return;
    }
    else if (act === 'regen') {
        void send({ regenerate: true, hint: ui.hint, keep: ui.keep });
        return;
    }
    else if (act === 'regenf') {
        void send({ regenerate: 'fonts', hint: ui.hintFonts, keep: ui.keepFonts });
        return;
    }
    else if (act === 'keepf')
        ui.keepFonts = ui.keepFonts.includes(v) ? ui.keepFonts.filter((k) => k !== v) : [...ui.keepFonts, v];
    else if (act === 'regenl') {
        void send({ regenerate: 'logos', hint: ui.hintLogos, keep: ui.keepLogos });
        return;
    }
    else if (act === 'regenw') {
        void send({ regenerate: 'names', hint: ui.hintWords, keep: ui.keepWords });
        return;
    }
    else if (act === 'keepl')
        ui.keepLogos = ui.keepLogos.includes(v) ? ui.keepLogos.filter((k) => k !== v) : [...ui.keepLogos, v];
    else if (act === 'keepw')
        ui.keepWords = ui.keepWords.includes(v) ? ui.keepWords.filter((k) => k !== v) : [...ui.keepWords, v];
    else if (act === 'keep')
        ui.keep = ui.keep.includes(v) ? ui.keep.filter((k) => k !== v) : [...ui.keep, v];
    else if (act === 'name')
        ui.name = v;
    else if (act === 'font')
        ui.font = Number(v);
    else if (act === 'count')
        ui.count = Number(v);
    else if (act === 'concept') {
        if (S.flow.status !== 'final')
            ui.concept = v;
        ui.viewConcept = v;
    }
    else if (act === 'wordmark') {
        if (S.flow.status !== 'final')
            ui.wordmark = v || null;
        ui.viewWord = v;
    }
    else if (act === 'palette')
        ui.palette = v;
    render();
    // the element just chosen answers the click; a new palette repaints the preview
    root.querySelector(`[data-act="${act}"][data-v="${CSS.escape(v)}"]`)?.classList.add('pop');
    if (act === 'palette' || act === 'concept')
        flash('swap', 800);
    if (act === 'wordmark')
        flash('swapw', 700);
});
root.addEventListener('input', (ev) => {
    const el = ev.target;
    const k = el.dataset.in;
    if (!k)
        return;
    if (k === 'custom') {
        ui.custom = el.value;
        ui.font = el.value.trim() ? -1 : 0;
    }
    else if (k === 'colors')
        ui.colors = el.value;
    else if (k === 'hint')
        ui.hint = el.value;
    else if (k === 'hintLogos')
        ui.hintLogos = el.value;
    else if (k === 'hintFonts')
        ui.hintFonts = el.value;
    else if (k === 'hintWords')
        ui.hintWords = el.value;
    else if (k === 'count') {
        const n = Math.floor(Number(el.value));
        if (n >= 3 && n <= 24)
            ui.count = n;
    }
});
root.addEventListener('change', (ev) => {
    const el = ev.target;
    const k = el.dataset.in;
    if (k === 'licence')
        ui.licence = el.checked;
    else if (k === 'svg')
        ui.svg = el.checked;
    else if (k !== 'custom' && k !== 'count')
        return;
    render();
});
if (live) {
    void poll();
    setInterval(() => { void poll(); }, 1200);
}
else
    render();
export {};
</script>
