<!--palette
bg       #141619 #F2F3F5
ink      #ECEEF0 #141619
body     #B4BAC1 #3F454C
muted    #959CA4 #5B6168
accent   #F04E15 #F04E15
acctext  #F26A36 #B83A0B
panel    #1D2024 #FFFFFF
line     #3A4047 #C9CED4
mk       #ECEEF0 #141619
thumb1   #C9CDD2 #C9CDD2
thumb2   #2A2D31 #2A2D31
thumb3   #E3E5E8 #E3E5E8
knob     #F5F6F7 #F5F6F7
dim      #7C838B #7C838B
bubble   #262A2F #ECEEF0
onacc    #141619 #141619
-->
<!--brief
sentence: someone shipping a project without a designer tells their AI agent what they like, and leaves with a logo of their own and a brand book they can send anyone.
input: the references the user hands the agent (this repository's own run: five product renders in grey with one orange accent, .kothar/brief.md).
output: the proposals report with three concepts (.kothar/proposals.html; concepts a-tongs, b-steps, c-dial in .kothar/concepts/), the chosen one (b-steps) and its brand book (assets/brand/brand-book.html, assets/brand/logo/, assets/brand/web/).
features: many ideas before any drawing (references/craft.md steps 1-2); logos drawn from your references (SKILL.md step 2, references/craft.md); checked at the size of a tab (references/craft.md step 5, rendering.md); one brand book to send anyone (references/report.md).
strip: none, the picture runs to the bottom edge.
left out as unfinished: nothing is marked unfinished.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="You hand your AI agent your references; it draws three logo proposals, you answer B in the chat, and the chosen logo becomes a brand book with its colours, app icon and the name kothar">
<style>
/* 12 s  marks A B C   |pop|pop|pop|=================================================|out
         reply B                       |in|=========================================|out
         chip B                       |press|
         ring B                          |in|=======================================|out
         reply build                            |in|================================|out
         parcel                                  |-----fly-----|
         book items    ===========|out|                        |in|in|in|in|=========
         features      four turns of 3 s */
@keyframes popA{0%,2%{opacity:0;transform:scale(.6)}6%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:scale(.6)}}
@keyframes popB{0%,6%{opacity:0;transform:scale(.6)}10%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:scale(.6)}}
@keyframes popC{0%,10%{opacity:0;transform:scale(.6)}14%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:scale(.6)}}
@keyframes reply{0%,28%{opacity:0;transform:translateY(12px)}31%,94%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}
@keyframes build{0%,36%{opacity:0;transform:translateY(12px)}39%,94%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}
@keyframes press{0%,26%{transform:scale(1)}28%{transform:scale(.88)}31%,100%{transform:scale(1)}}
@keyframes chosen{0%,27%{opacity:0}30%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes ring{0%,31%{opacity:0}34%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes fly{0%,40%{transform:translate(0,0) scale(1);opacity:0}42%{transform:translate(0,0) scale(1);opacity:1}54%{transform:translate(-98px,252px) scale(1.667);opacity:1}57%,100%{transform:translate(-98px,252px) scale(1.667);opacity:0}}
@keyframes book1{0%,34%{opacity:1}38%,53%{opacity:0}56%,100%{opacity:1}}
@keyframes book2{0%,34%{opacity:1}38%,59%{opacity:0}62%,100%{opacity:1}}
@keyframes book3{0%,34%{opacity:1}38%,65%{opacity:0}68%,100%{opacity:1}}
@keyframes book4{0%,34%{opacity:1}38%,71%{opacity:0}74%,100%{opacity:1}}
@keyframes turn{0%{transform:translateY(32px);opacity:0}4%,25%{transform:translateY(0);opacity:1}29%,100%{transform:translateY(-32px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
.popA,.popB,.popC{transform-box:fill-box;transform-origin:center}
.popA{animation:popA 12s cubic-bezier(0,0,.2,1) infinite}
.popB{animation:popB 12s cubic-bezier(0,0,.2,1) infinite}
.popC{animation:popC 12s cubic-bezier(0,0,.2,1) infinite}
.reply{animation:reply 12s cubic-bezier(0,0,.2,1) infinite}
.build{animation:build 12s cubic-bezier(0,0,.2,1) infinite}
.press{animation:press 12s ease-out infinite;transform-box:fill-box;transform-origin:center}
.chosen{animation:chosen 12s ease-out infinite}
.ring{animation:ring 12s ease-out infinite}
.fly{animation:fly 12s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
.book1{animation:book1 12s ease-out infinite}
.book2{animation:book2 12s ease-out infinite}
.book3{animation:book3 12s ease-out infinite}
.book4{animation:book4 12s ease-out infinite}
.turn{animation:turn 12s cubic-bezier(.4,0,.2,1) infinite}
.flow{animation:flow 1.2s linear infinite}
.caret{animation:caret 1.1s steps(1,end) infinite}
</style>
<defs>
<symbol id="mb" viewBox="0 0 256 256"><path fill="$mk" d="M24 24H96V96H24ZM122 24H166A14 14 0 0 1 180 38V82A14 14 0 0 1 166 96H122A14 14 0 0 1 108 82V38A14 14 0 0 1 122 24ZM52 108H68A28 28 0 0 1 96 136V152A28 28 0 0 1 68 180H52A28 28 0 0 1 24 152V136A28 28 0 0 1 52 108Z"/><circle cx="170.5" cy="170.5" r="62.5" fill="$accent"/></symbol>
<symbol id="ma" viewBox="0 0 256 256"><path d="M182 232L128 158L82.6 114A52 52 0 0 1 90 41.5M74 232L128 158L173.4 114A52 52 0 0 0 166 41.5" fill="none" stroke="$mk" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="78" r="28" fill="$accent"/></symbol>
<symbol id="mc" viewBox="0 0 256 256"><path fill="$mk" fill-rule="evenodd" d="M128 28A100 100 0 1 1 127.9 28ZM128 74A54 54 0 1 0 128.1 74Z"/><path d="M128 128L152 104" fill="none" stroke="$accent" stroke-width="24" stroke-linecap="round"/></symbol>
<clipPath id="feat"><rect x="56" y="454" width="500" height="48"/></clipPath>
</defs>
<rect width="1280" height="640" fill="$bg"/>
<g id="backdrop" data-backdrop="grid still"><defs><pattern id="bd-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40M0 0V40" fill="none" stroke="$line" stroke-width="1"/></pattern></defs><rect x="-40" y="-40" width="1360" height="720" fill="url(#bd-grid)" opacity=".35"/></g>

<!-- text block -->
<g id="logo" transform="translate(56 80) scale(.21875)"><path fill="$mk" d="M24 24H96V96H24ZM122 24H166A14 14 0 0 1 180 38V82A14 14 0 0 1 166 96H122A14 14 0 0 1 108 82V38A14 14 0 0 1 122 24ZM52 108H68A28 28 0 0 1 96 136V152A28 28 0 0 1 68 180H52A28 28 0 0 1 24 152V136A28 28 0 0 1 52 108Z"/><circle cx="170.5" cy="170.5" r="62.5" fill="$accent"/></g>
<text id="name" class="b" x="124" y="122" font-size="40" fill="$ink">kothar</text>
<text id="tagline" class="b" font-size="50" fill="$ink"><tspan x="56" y="236">A logo and a brand</tspan><tspan x="56" y="294" fill="$acctext">for your project.</tspan></text>
<text id="about" class="s" font-size="20" fill="$body"><tspan x="56" y="356">A skill for your AI agent. It asks what you like,</tspan><tspan x="56" y="386">draws your logo and builds its brand book.</tspan></text>
<g id="facts" clip-path="url(#feat)">
<g class="turn" opacity="0" style="animation-delay:-9s"><rect x="56" y="468" width="14" height="14" rx="3" fill="$accent"/><text x="84" y="483" class="s" font-size="20" fill="$ink">Many ideas before any drawing</text></g>
<g class="turn" opacity="0" style="animation-delay:-6s"><rect x="56" y="468" width="14" height="14" rx="3" fill="$accent"/><text x="84" y="483" class="s" font-size="20" fill="$ink">Logos drawn from your references</text></g>
<g class="turn" opacity="0" style="animation-delay:-3s"><rect x="56" y="468" width="14" height="14" rx="3" fill="$accent"/><text x="84" y="483" class="s" font-size="20" fill="$ink">Checked at the size of a tab</text></g>
<g class="turn" style="animation-delay:0s"><rect x="56" y="468" width="14" height="14" rx="3" fill="$accent"/><text x="84" y="483" class="s" font-size="20" fill="$ink">One brand book to send anyone</text></g>
</g>

<g id="stage">
<!-- the chat with the agent -->
<g data-kit="window"><rect x="600" y="40" width="300" height="532" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/><path d="M600 74H900" stroke="$line" stroke-width="1.5"/><circle cx="620" cy="57" r="5" fill="$line"/><circle cx="636" cy="57" r="5" fill="$line"/><circle cx="652" cy="57" r="5" fill="$line"/><text x="750" y="62" class="m" font-size="14" fill="$muted" text-anchor="middle">Your agent</text></g>
<!-- you: the references -->
<rect x="668" y="92" width="216" height="118" rx="14" fill="$bubble"/>
<text x="684" y="118" class="s" font-size="16" fill="$body">My references</text>
<rect x="684" y="130" width="56" height="64" rx="8" fill="$thumb1"/><circle cx="712" cy="162" r="16" fill="$knob"/><circle cx="712" cy="162" r="5" fill="$accent"/>
<rect x="748" y="130" width="56" height="64" rx="8" fill="$thumb2"/><circle cx="776" cy="162" r="14" fill="none" stroke="$accent" stroke-width="5"/>
<rect x="812" y="130" width="56" height="64" rx="8" fill="$thumb3"/><circle cx="830" cy="146" r="6" fill="none" stroke="$dim" stroke-width="2"/><circle cx="830" cy="162" r="6" fill="none" stroke="$dim" stroke-width="2"/><circle cx="830" cy="178" r="6" fill="none" stroke="$dim" stroke-width="2"/><circle cx="852" cy="170" r="9" fill="$accent"/>
<!-- the agent asks -->
<rect x="616" y="228" width="236" height="104" rx="14" fill="$bubble"/>
<text x="632" y="256" class="s" font-size="16" fill="$ink">Which one do we take</text>
<text x="632" y="276" class="s" font-size="16" fill="$ink">forward?</text>
<g data-kit="chip"><rect x="632" y="290" width="36" height="28" rx="14" fill="none" stroke="$muted" stroke-width="1.5"/><text x="650" y="309" class="s" font-size="16" fill="$body" text-anchor="middle">A</text></g>
<g class="press"><g data-kit="chip"><rect x="676" y="290" width="36" height="28" rx="14" fill="none" stroke="$accent" stroke-width="1.5"/><text x="694" y="309" class="s" font-size="16" fill="$acctext" text-anchor="middle">B</text></g></g>
<g data-kit="chip"><rect x="720" y="290" width="36" height="28" rx="14" fill="none" stroke="$muted" stroke-width="1.5"/><text x="738" y="309" class="s" font-size="16" fill="$body" text-anchor="middle">C</text></g>
<!-- you answer B -->
<g class="reply"><rect x="812" y="350" width="72" height="44" rx="14" fill="$accent"/><text x="848" y="378" class="b" font-size="18" fill="$onacc" text-anchor="middle">B</text></g>
<!-- the agent builds -->
<g class="build"><rect x="616" y="412" width="236" height="52" rx="14" fill="$bubble"/><text x="632" y="443" class="s" font-size="16" fill="$ink">Building your brand book</text></g>
<!-- the input -->
<rect x="616" y="508" width="268" height="44" rx="12" fill="none" stroke="$line" stroke-width="1.5"/>
<rect class="caret" x="632" y="520" width="3" height="20" fill="$accent"/>

<!-- connectors -->
<path class="flow" d="M902 164H916" fill="none" stroke="$muted" stroke-width="2" stroke-dasharray="8 16"/>
<path d="M914 158l8 6-8 6" fill="none" stroke="$muted" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path class="flow" d="M1082 290V304" fill="none" stroke="$muted" stroke-width="2" stroke-dasharray="8 16"/>
<path d="M1076 302l6 8 6-8" fill="none" stroke="$muted" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- the proposals report -->
<g data-kit="window"><rect x="924" y="40" width="316" height="248" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/><path d="M924 74H1240" stroke="$line" stroke-width="1.5"/><circle cx="944" cy="57" r="5" fill="$line"/><circle cx="960" cy="57" r="5" fill="$line"/><circle cx="976" cy="57" r="5" fill="$line"/><text x="1082" y="62" class="m" font-size="14" fill="$muted" text-anchor="middle">proposals.html</text></g>
<rect x="944" y="94" width="84" height="174" rx="10" fill="$bubble"/>
<rect x="1040" y="94" width="84" height="174" rx="10" fill="$bubble"/>
<rect x="1136" y="94" width="84" height="174" rx="10" fill="$bubble"/>
<g class="popA"><use href="#ma" x="958" y="122" width="56" height="56"/></g>
