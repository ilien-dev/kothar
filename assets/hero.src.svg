<!-- the brand book -->
<g data-kit="window"><rect x="924" y="312" width="316" height="260" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/><path d="M924 346H1240" stroke="$line" stroke-width="1.5"/><circle cx="944" cy="329" r="5" fill="$line"/><circle cx="960" cy="329" r="5" fill="$line"/><circle cx="976" cy="329" r="5" fill="$line"/><text x="1082" y="334" class="m" font-size="14" fill="$muted" text-anchor="middle">brand-book.html</text></g>
