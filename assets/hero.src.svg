<text x="1178" y="236" class="b" font-size="18" fill="$body" text-anchor="middle">C</text>
<rect class="ring" x="1040" y="94" width="84" height="174" rx="10" fill="none" stroke="$accent" stroke-width="3"/>

<!-- the chosen logo travels -->
