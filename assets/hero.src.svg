<!--brief
sentence: someone starting a project with no designer asks their AI agent for a name or a logo and chooses, step by step in the browser, among names with their meaning and logos tested before they see them.
input: the project's own description (README.md, first lines: "names a product and builds its logo identity").
output: nine options drawn for this repository (.kothar/concepts/c4, c10, c11, c14, c15, c16, c17/mark.svg), one warned for likeness (.kothar/audit.json, c10: close to a map icon, 0.825), the chosen "Escuadra y punto" (c4) and its identity (assets/logo/).
features: names with their story (skills/kothar/references/naming.md, gate in src/identity.ts); clear as a tab icon (src/measure.ts, 16 px); not a copy of a famous logo (src/similarity.ts); you choose every step in the browser (src/server.ts, src/web/app.ts).
left out as unfinished: nothing is marked unfinished.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="From a project's description to its logo: Kothar draws nine options, scans them, flags one that looks like a map icon, the square-and-dot option is chosen and becomes an identity in black, white and grey">
<style>
/* 10 s  read     |in|==========================================|out
         scan            |----sweep----|
         warn                       |in|===========================|out
         pick                              |in|=========================|out
         fly                                |--fly--|
         identity                                    |in|==============|out
         features  four turns of 2.5 s */
@keyframes rise{to{transform:translateY(-320px)}}
@keyframes read{0%,6%{opacity:0}10%,95%{opacity:1}100%{opacity:0}}
@keyframes scan{0%,24%{transform:translateY(0);opacity:0}26%{opacity:1}46%{transform:translateY(244px);opacity:1}48%,100%{transform:translateY(244px);opacity:0}}
@keyframes warn{0%,42%{opacity:0}45%,94%{opacity:1}100%{opacity:0}}
@keyframes pick{0%,52%{opacity:0}55%,96%{opacity:1}100%{opacity:0}}
@keyframes fly{0%,56%{transform:translate(246px,0) scale(1);opacity:0}59%{transform:translate(246px,0) scale(1);opacity:1}70%{transform:translate(300px,-117px) scale(.667);opacity:1}73%,100%{transform:translate(300px,-117px) scale(.667);opacity:0}}
@keyframes idin{0%,70%{opacity:0}74%,96%{opacity:1}100%{opacity:0}}
@keyframes turn{0%{transform:translateY(32px);opacity:0}4%,25%{transform:translateY(0);opacity:1}29%,100%{transform:translateY(-32px);opacity:0}}
.rise{animation:rise 40s linear infinite}
.read{animation:read 10s ease-out infinite}
.scan{animation:scan 10s cubic-bezier(.4,0,.2,1) infinite}
.warn{animation:warn 10s ease-out infinite}
.pick{animation:pick 10s ease-out infinite}
.fly{animation:fly 10s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 0}
.idin{animation:idin 10s ease-out infinite}
.turn{animation:turn 10s cubic-bezier(.4,0,.2,1) infinite}
</style>
