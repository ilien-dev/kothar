<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="Six pages of one brand book, brand-book.html, light up one after another: the symbol at three sizes, the colours with their code, the logo beside the name kothar, two app icons, a GitHub image and a logo that assembles itself">
<style>
/* 12 s  the ring lights each page for 2 s, in reading order
         swatches lift while Colours is lit; the animated logo assembles while its page is lit */
@keyframes lit0{0%{opacity:0}2%,15%{opacity:1}17%,100%{opacity:0}}
.lit0{animation:lit0 12s ease-in-out infinite}
@keyframes lit1{0%,16.7%{opacity:0}18.7%,31.7%{opacity:1}33.7%,100%{opacity:0}}
.lit1{animation:lit1 12s ease-in-out infinite}
@keyframes lit2{0%,33.3%{opacity:0}35.3%,48.3%{opacity:1}50.3%,100%{opacity:0}}
.lit2{animation:lit2 12s ease-in-out infinite}
@keyframes lit3{0%,50%{opacity:0}52%,65%{opacity:1}67%,100%{opacity:0}}
.lit3{animation:lit3 12s ease-in-out infinite}
@keyframes lit4{0%,66.7%{opacity:0}68.7%,81.7%{opacity:1}83.7%,100%{opacity:0}}
.lit4{animation:lit4 12s ease-in-out infinite}
@keyframes lit5{0%,83.3%{opacity:0}85.3%,98.3%{opacity:1}100.3%,100%{opacity:0}}
.lit5{animation:lit5 12s ease-in-out infinite}
@keyframes sw{0%,16%{transform:none}19%,29%{transform:translateY(-6px)}32%,100%{transform:none}}
.sw{animation:sw 12s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes a1{0%,80%{opacity:1;transform:none}82%,86%{opacity:0;transform:scale(.4)}89%,100%{opacity:1;transform:none}}
@keyframes a2{0%,80%{opacity:1;transform:none}82%,88%{opacity:0;transform:scale(.4)}91%,100%{opacity:1;transform:none}}
@keyframes a3{0%,80%{opacity:1;transform:none}82%,90%{opacity:0;transform:scale(.4)}93%,100%{opacity:1;transform:none}}
@keyframes a4{0%,80%{opacity:1;transform:none}82%,92%{opacity:0;transform:scale(.4)}95%,100%{opacity:1;transform:none}}
.a1{animation:a1 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
.a2{animation:a2 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
.a3{animation:a3 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
.a4{animation:a4 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
</style>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop" data-backdrop="grid still"><defs><pattern id="bd-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40M0 0V40" fill="none" stroke="$line" stroke-width="1"/></pattern></defs><rect x="-40" y="-40" width="1360" height="528" fill="url(#bd-grid)" opacity=".35"/></g>
<text id="eyebrow" class="m" x="56" y="80" font-size="14" fill="$acctext" letter-spacing="2">WHAT YOU GET</text>
<text id="title" class="b" font-size="40" fill="$ink"><tspan x="56" y="136">One brand book,</tspan><tspan x="56" y="182">every piece inside</tspan></text>
<text id="sub" class="s" font-size="18" fill="$body"><tspan x="56" y="232">Open it in any browser,</tspan><tspan x="56" y="258">print it to PDF.</tspan></text>
