<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="Your agent writes eight ideas in ideas.md and strikes out five; the first one kept travels to the drawing, which improves from v1 to v3, and a browser tab shows the same logo at tab size with a check when it passes">
<style>
/* 12 s  strikes     |s|s|s|s|s|=============================================|out
         keep                   |in|=========================================|out
         parcel                  |--go--|
         v1 / v2 / v3                     |v1====|v2====|v3===================
         check                                         |in|================== */
@keyframes st0{0%,2%{opacity:0;transform:scaleX(.1)}5%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.st0{animation:st0 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes st1{0%,6%{opacity:0;transform:scaleX(.1)}9%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.st1{animation:st1 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes st2{0%,10%{opacity:0;transform:scaleX(.1)}13%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.st2{animation:st2 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes st3{0%,14%{opacity:0;transform:scaleX(.1)}17%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.st3{animation:st3 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes st4{0%,18%{opacity:0;transform:scaleX(.1)}21%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.st4{animation:st4 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes keep{0%,22%{opacity:0}25%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes go{0%,25%{transform:translate(0,0);opacity:0}27%{opacity:1}34%{transform:translate(198px,104px);opacity:1}36%,100%{transform:translate(198px,104px);opacity:0}}
@keyframes v1{0%,32%{opacity:0}35%,50%{opacity:1}53%,100%{opacity:0}}
@keyframes v2{0%,50%{opacity:0}53%,68%{opacity:1}71%,100%{opacity:0}}
@keyframes v3{0%,32%{opacity:1}35%,68%{opacity:0}71%,100%{opacity:1}}
@keyframes ok{0%,32%{opacity:1;transform:none}35%,74%{opacity:0;transform:scale(.6)}77%,100%{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-24}}
.keep{animation:keep 12s ease-out infinite}
.go{animation:go 12s cubic-bezier(.4,0,.2,1) infinite}
.v1{animation:v1 12s ease-in-out infinite}.v2{animation:v2 12s ease-in-out infinite}.v3{animation:v3 12s ease-in-out infinite}
.ok{animation:ok 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.2s linear infinite}
</style>
<rect width="1280" height="448" fill="$bg"/>
